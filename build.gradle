plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java-library'
    id 'maven-publish'
}

group = 'kr.suhsaechan'

// Gradle의 project.version 기본값이 'unspecified'라 findProperty는 절대 null을 주지 않는다.
// -Pversion 으로 넘어온 값만 채택하고, 없으면 아래 기본값을 쓴다 (version.yml과 동기화).
def injectedVersion = project.findProperty('version')
version = (injectedVersion == null || injectedVersion.toString() == 'unspecified')
        ? '3.0.0'
        : injectedVersion.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring — 라이브러리이므로 consumer에게 강제하지 않는다
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-context'
    compileOnly 'org.springframework:spring-web'

    // 로깅 API — 상위 프로젝트에 이미 있으면 그것을 쓰고, 없으면 JUL로 폴백한다.
    // compileOnly라 consumer 에게 어떤 로깅 구현체도 강제하지 않는다.
    compileOnly 'org.slf4j:slf4j-api'
    compileOnly 'org.apache.logging.log4j:log4j-api'

    // Swagger 통합 — springdoc이 있을 때만 동작하므로 런타임 의존성으로 끌고 가지 않는다
    compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.jsoup:jsoup:1.23.2'

    // 테스트 — spring-boot-starter-test가 slf4j-api + logback을 끌고 온다
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testImplementation 'org.springframework:spring-web'
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    testImplementation 'org.apache.logging.log4j:log4j-api'
    testImplementation 'org.apache.logging.log4j:log4j-core'
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

bootJar { enabled = false }

jar {
    enabled = true
    // Spring Boot 플러그인은 bootJar 와 구분하려고 jar 에 'plain' 분류자를 붙인다.
    // 그대로 두면 -plain.jar 만 배포되고 pom 이 packaging=pom 이 되어 Maven 사용자가 jar 를 받지 못한다.
    archiveClassifier = ''
    manifest {
        attributes('Implementation-Title': 'suh-api-log',
                   'Implementation-Version': project.version)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'suh-api-log'
                description = '서새찬 API 로깅 라이브러리'
                url = 'https://github.com/Cassiiopeia/suh-api-log/'
            }
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = 'nexus'
            url = uri(
                    version.endsWith('SNAPSHOT')
                            ? "https://nexus.suhsaechan.kr/repository/maven-snapshots/"
                            : "https://nexus.suhsaechan.kr/repository/maven-releases/"
            )
            credentials {
                // 자격증명은 리포지토리에 커밋하지 않는다.
                // ~/.gradle/gradle.properties 또는 ORG_GRADLE_PROJECT_* 환경변수로 주입한다.
                username = project.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
                password = project.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
            }
        }
    }
}
