# ===================================================================
# 문서 사이트(MkDocs Material) GitHub Pages 배포 워크플로우
# ===================================================================
#
# 동작: site/mkdocs.yml 로 site/docs/ 를 빌드해 GitHub Pages 에 배포한다.
# 트리거: main 브랜치 push 중 site/** 변경 (+ 수동 실행)
# 사전 설정: Settings → Pages → Source 를 "GitHub Actions" 로 지정
# 주소: https://cassiiopeia.github.io/suh-api-log/
# ===================================================================

name: PROJECT-DOCS-PAGES-DEPLOY

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/PROJECT-DOCS-PAGES-DEPLOY.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포는 한 번에 하나만. 진행 중인 배포를 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: 문서 빌드
        run: |
          pip install -r site/requirements.txt
          # --strict: 깨진 링크·없는 페이지가 있으면 배포하지 않는다
          mkdocs build --strict -f site/mkdocs.yml -d "$GITHUB_WORKSPACE/_site"

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
