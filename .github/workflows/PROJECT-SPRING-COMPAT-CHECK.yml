# ===================================================================
# Spring Boot 3 / 4 호환 확인 워크플로우
# ===================================================================
#
# 라이브러리는 Boot 3 기준으로 컴파일하지만 Boot 4 사용자도 받는다.
# 같은 예제 컨트롤러를 Boot 3(examples/demo)·Boot 4(examples/demo-boot4) 위에서 실제로 띄워
# Swagger(OpenAPI) 설명에 변경 이력 표가 붙는지 확인한다. 단위 테스트로는 잡히지 않는
# 자동 설정 등록·springdoc 연동 깨짐을 여기서 잡는다.
# ===================================================================

name: PROJECT-SPRING-COMPAT-CHECK

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-compat:
    name: Spring Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boot: "3"
            app: demo
          - boot: "4"
            app: demo-boot4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: 예제 앱 빌드
        run: ./gradlew -p examples/${{ matrix.app }} bootJar

      - name: 기동 후 변경 이력 표 확인
        run: |
          JAR=$(ls examples/${{ matrix.app }}/build/libs/*.jar | head -1)
          # blocking: 이슈 조회가 끝난 뒤에 부팅이 완료되므로 바로 결과를 확인할 수 있다
          java -jar "$JAR" --server.port=18080 --suhapilog.github.startup-mode=blocking > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:18080/v3/api-docs -o api-docs.json && break
            sleep 2
          done
          if [ ! -s api-docs.json ]; then
            echo "❌ 앱이 기동하지 않았습니다"; cat app.log; exit 1
          fi
          # 이슈 조회(GitHub 네트워크)가 실패해도 표 자체는 나와야 한다 — 표 존재만 확인
          if grep -q "API 변경 이력" api-docs.json; then
            echo "✅ Spring Boot ${{ matrix.boot }}: 변경 이력 표 확인"
          else
            echo "❌ 변경 이력 표가 없습니다"; cat app.log; exit 1
          fi
