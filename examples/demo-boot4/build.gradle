plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'kr.suhsaechan'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// 컨트롤러·설정은 Boot 3 예제(examples/demo)와 같은 것을 쓴다 — 같은 코드가 두 버전에서 똑같이 동작하는지 보는 것이 목적
sourceSets {
    main {
        java.srcDirs = ['../demo/src/main/java']
        resources.srcDirs = ['../demo/src/main/resources']
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Boot 4 는 springdoc 3.x 를 쓴다
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    // settings.gradle 의 includeBuild 로 레포 루트 소스가 대체된다 (버전 값은 무시됨)
    implementation 'kr.suhsaechan:suh-api-log:+'
}
